<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - STOXLY</title>

<link rel="stylesheet" href="css/login.css">

<style>

body{

background:linear-gradient(135deg,#2563eb,#1e3a8a);
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.login-box{

width:420px;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,.25);

}

.logo{

text-align:center;
font-size:40px;
margin-bottom:10px;

}

.title{

text-align:center;
margin-bottom:30px;
color:#2563eb;

}

button{

width:100%;

}

.register{

text-align:center;
margin-top:20px;

}

.register a{

color:#2563eb;
text-decoration:none;
font-weight:bold;

}

</style>

</head>

<body>

<div class="login-bg">

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="grid"></div>

<div class="login-container">

<div class="login-card">

<div class="logo-area">

<img src="assets/logo.svg" class="logo-img">

<h1>STOXLY</h1>

<p>Smart Inventory Exchange</p>

</div>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<div class="links">

<a href="register.html">

Create Account

</a>

</div>

<p id="message"></p>

</div>

</div>

</div>

<script src="js/main.js"></script>

</body>

</html>
